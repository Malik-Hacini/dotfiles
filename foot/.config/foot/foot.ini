[main]
# Omarchy atomically updates this palette on every theme change.
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font Mono:size=9,RobotoMono Nerd Font Propo:size=9
shell=/usr/bin/fish
pad=0x0
initial-window-size-pixels=960x1052
initial-window-mode=windowed
selection-target=clipboard
workers=0

[scrollback]
lines=5000
multiplier=0.5

[cursor]
style=block
blink=no

[bell]
system=no
urgent=no
notify=no

[colors-dark]
alpha=0.94

[csd]
preferred=none

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
font-increase=Control+Shift+equal Control+Shift+plus Control+Shift+KP_Add
font-decrease=Control+Shift+minus Control+Shift+KP_Subtract

[text-bindings]
# Let terminal applications distinguish modified Enter keys.
\x1b[13;2u=Shift+Return
\x1b[13;4u=Mod1+Shift+Return
