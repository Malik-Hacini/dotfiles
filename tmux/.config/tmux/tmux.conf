# Easy config reload
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf sourced!"

# Send prefix
set -g prefix M-Tab 
bind M-Tab send-prefix

# Windows
bind-key q kill-window
bind-key v split-window
bind-key Enter new-window

# Mouse mode
setw -g mouse on

# Fast toggle (normally prefix-l)
bind-key Tab last-window

# FR AZERTY: select windows with number row without Shift
bind-key -T prefix "&" select-window -t 1
bind-key -T prefix "é" select-window -t 2
bind-key -T prefix "\"" select-window -t 3
bind-key -T prefix "'" select-window -t 4
bind-key -T prefix "(" select-window -t 5
bind-key -T prefix "-" select-window -t 6
bind-key -T prefix "è" select-window -t 7
bind-key -T prefix "_" select-window -t 8
bind-key -T prefix "ç" select-window -t 9
bind-key -T prefix "à" select-window -t 10
# Vim pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# Automatically renumber window numbers on closing a pane
set -g renumber-windows on

# Start window and pane numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Don't wait for an escape sequence after seeing C-a
set -s escape-time 0

# Focus events for auto-read to work
set -g focus-events on

# Clipboard: forward OSC 52 sequences to the outer terminal
# so programs inside tmux can access the system clipboard directly
set -s set-clipboard on

# Allow escape sequences (images, OSC) to pass through to the terminal
set -g allow-passthrough on

# Keep TERM metadata from the attached client so image-capable tools such as
# yazi can detect kitty correctly inside tmux.
# Keep GUI/session vars current when attaching existing tmux sessions.
# Include I3SOCK so i3-msg works from tmux panes after reattach.
set -g update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS XDG_SESSION_TYPE XDG_CURRENT_DESKTOP I3SOCK PATH TERM TERM_PROGRAM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID"

# Seed tmux env from systemd --user activation environment (set by i3 on login).
# Avoid guessing DISPLAY from /tmp/.X11-unix because :0 is often GDM, not the user session.
run-shell 'if command -v systemctl >/dev/null 2>&1; then systemctl --user show-environment 2>/dev/null | while IFS="=" read -r key value; do case "$key" in DISPLAY|XAUTHORITY|XDG_RUNTIME_DIR|DBUS_SESSION_BUS_ADDRESS|XDG_SESSION_TYPE|XDG_CURRENT_DESKTOP|I3SOCK) [ -n "$value" ] || continue; tmux set-environment -g "$key" "$value"; for s in $(tmux list-sessions -F "#S" 2>/dev/null); do tmux set-environment -t "$s" "$key" "$value"; done ;; esac; done; fi'
# Heal broken resurrect state before plugins load.
# Empty snapshot files still happen in the wild and can make continuum restore
# tear down the fresh bootstrap session. Keep `last` pointed at the newest
# non-empty snapshot and prune obviously broken zero-byte saves.
run-shell 'for dir in "${XDG_DATA_HOME:-$HOME/.local/share}/tmux/resurrect" "$HOME/.tmux/resurrect"; do [ -d "$dir" ] || continue; latest_good=""; for snapshot in $(ls -t "$dir"/tmux_resurrect_*.txt 2>/dev/null); do if [ -s "$snapshot" ]; then latest_good=${snapshot##*/}; break; fi; rm -f "$snapshot"; done; last="$dir/last"; if [ -e "$last" ] || [ -L "$last" ]; then if [ ! -s "$last" ]; then if [ -n "$latest_good" ]; then ln -sfn "$latest_good" "$last"; else rm -f "$last"; fi; fi; elif [ -n "$latest_good" ]; then ln -sfn "$latest_good" "$last"; fi; done; true'

# Terminal setup
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-kitty:Tc,alacritty:Tc,xterm-256color:Tc"

# Catppuccin layout with pywal-fed palette
if-shell '[ -f "$HOME/.cache/wal/tmux-theme.conf" ]' 'source-file "$HOME/.cache/wal/tmux-theme.conf"'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_text " #{=/30/...:#{?#{m/r:^(fish|zsh|bash|sh|dash|ksh|mksh|ash|nu|xonsh|pwsh|powershell)$,#{pane_current_command}},#{pane_title},#{?#{m/r:^[^ ]+ (~/|/),#{pane_title}},#{s| .*||:pane_title},#{pane_title}}}}"
set -g @catppuccin_window_current_text " #{=/30/...:#{?#{m/r:^(fish|zsh|bash|sh|dash|ksh|mksh|ash|nu|xonsh|pwsh|powershell)$,#{pane_current_command}},#{pane_title},#{?#{m/r:^[^ ]+ (~/|/),#{pane_title}},#{s| .*||:pane_title},#{pane_title}}}}"
set -g @catppuccin_window_left_separator " "
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_current_left_separator " "
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator " "
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_session_icon "  "
set -g @catppuccin_session_text " #S "
set -g @catppuccin_session_color "#{?client_prefix,#{E:@thm_red},#{E:@thm_mauve}}"
set -g @catppuccin_status_session_icon_bg "#{?client_prefix,#{E:@thm_red},#{E:@thm_mauve}}"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status line (must be set after loading catppuccin)
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g window-status-separator " "
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
# Tmux hardcodes < and > as the default window-list trim markers inside the
# built-in status-format[0] string. Replace just those markers to keep the rest
# of tmux's default window-list behavior intact.
run-shell 'fmt=$(tmux show -gv status-format[0] | perl -pe "s/\\#\\[list=left-marker\\]</#[list=left-marker]|/; s/\\#\\[list=right-marker\\]>/#[list=right-marker]|/"); tmux set -g status-format[0] "$fmt"'

# TPM plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence (resurrect)
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-processes 'lazygit btop '
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-systemd-start-cmd 'new-session -d'

# Initialize TPM (keep this at the bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
